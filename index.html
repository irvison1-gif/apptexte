<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minhas Finanças</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3348;
    --accent: #5b6af0;
    --accent-light: #7c89f5;
    --green: #3ecf8e;
    --red: #f25c5c;
    --text: #e8eaf6;
    --muted: #7b82a3;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  header h1 span { color: var(--accent-light); }

  nav {
    display: flex;
    gap: 6px;
  }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 7px 16px;
    border-radius: 8px;
    transition: all .2s;
  }
  nav button.active, nav button:hover {
    background: var(--surface2);
    color: var(--text);
  }
  nav button.active { color: var(--accent-light); }

  /* LAYOUT */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* CARDS */
  .cards-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 20px;
  }
  .card .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card .value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
  }
  .card.saldo .value { color: var(--accent-light); }
  .card.receita .value { color: var(--green); }
  .card.despesa .value { color: var(--red); }

  /* CHART */
  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 28px;
  }
  .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 18px;
  }
  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar-cat {
    width: 110px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .bar-track {
    flex: 1;
    height: 10px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width .5s ease;
  }
  .bar-val {
    width: 80px;
    text-align: right;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex-shrink: 0;
  }
  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
  }

  /* FORM */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 540px;
  }
  .form-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .tipo-toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .tipo-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
  }
  .tipo-btn.receita.active {
    border-color: var(--green);
    color: var(--green);
    background: rgba(62,207,142,.08);
  }
  .tipo-btn.despesa.active {
    border-color: var(--red);
    color: var(--red);
    background: rgba(242,92,92,.08);
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field select option { background: var(--surface2); }

  .btn-save {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }
  .btn-save:hover { background: var(--accent-light); }

  /* EXTRATO */
  .filter-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-row select, .filter-row input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 13px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  .filter-row select option { background: var(--surface2); }

  .transacoes-lista { display: flex; flex-direction: column; gap: 8px; }
  .transacao-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color .2s;
  }
  .transacao-item:hover { border-color: var(--accent); }
  .tipo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tipo-dot.receita { background: var(--green); }
  .tipo-dot.despesa { background: var(--red); }
  .tx-info { flex: 1; }
  .tx-desc { font-weight: 500; font-size: 14px; }
  .tx-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tx-valor {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }
  .tx-valor.receita { color: var(--green); }
  .tx-valor.despesa { color: var(--red); }
  .tx-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 17px;
    padding: 0 4px;
    transition: color .2s;
    line-height: 1;
  }
  .tx-del:hover { color: var(--red); }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s;
    z-index: 999;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* MONTH FILTER */
  .month-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .month-filter label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
  }
  .month-filter input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  @media (max-width: 600px) {
    .cards-row { grid-template-columns: 1fr; }
    header { padding: 14px 16px; }
    header h1 { font-size: 1.05rem; }
    nav button { font-size: 12px; padding: 6px 10px; }
    main { padding: 20px 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>💰 Minhas <span>Finanças</span></h1>
  <nav>
    <button class="active" onclick="showPage('dashboard', this)">Dashboard</button>
    <button onclick="showPage('novo', this)">+ Lançar</button>
    <button onclick="showPage('extrato', this)">Extrato</button>
  </nav>
</header>

<main>

  <!-- DASHBOARD -->
  <div id="dashboard" class="page active">
    <div class="month-filter">
      <label>Mês:</label>
      <input type="month" id="mesFilter" onchange="renderDashboard()" />
    </div>
    <div class="cards-row">
      <div class="card saldo">
        <div class="label">Saldo</div>
        <div class="value" id="cardSaldo">R$ 0,00</div>
      </div>
      <div class="card receita">
        <div class="label">Receitas</div>
        <div class="value" id="cardReceita">R$ 0,00</div>
      </div>
      <div class="card despesa">
        <div class="label">Despesas</div>
        <div class="value" id="cardDespesa">R$ 0,00</div>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Despesas por categoria</div>
      <div class="bar-chart" id="barChart">
        <div class="empty-state">Nenhuma despesa neste mês.</div>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Últimas transações</div>
      <div id="ultimas"></div>
    </div>
  </div>

  <!-- NOVO LANÇAMENTO -->
  <div id="novo" class="page">
    <div class="form-card">
      <h2>Novo Lançamento</h2>
      <div class="tipo-toggle">
        <button class="tipo-btn receita active" id="btnReceita" onclick="setTipo('receita')">📈 Receita</button>
        <button class="tipo-btn despesa" id="btnDespesa" onclick="setTipo('despesa')">📉 Despesa</button>
      </div>
      <div class="field">
        <label>Descrição</label>
        <input type="text" id="fDesc" placeholder="Ex: Salário, Supermercado..." />
      </div>
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" id="fValor" placeholder="0,00" min="0" step="0.01" />
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="fCategoria"></select>
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="fData" />
      </div>
      <button class="btn-save" onclick="salvar()">Salvar lançamento</button>
    </div>
  </div>

  <!-- EXTRATO -->
  <div id="extrato" class="page">
    <div class="filter-row">
      <input type="month" id="extratoMes" onchange="renderExtrato()" />
      <select id="extratoTipo" onchange="renderExtrato()">
        <option value="">Todos</option>
        <option value="receita">Receitas</option>
        <option value="despesa">Despesas</option>
      </select>
      <select id="extratoCategoria" onchange="renderExtrato()">
        <option value="">Todas as categorias</option>
      </select>
    </div>
    <div class="transacoes-lista" id="listaExtrato">
      <div class="empty-state">Nenhuma transação encontrada.</div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
const CATEGORIAS = {
  receita: ['Salário','Freelance','Investimentos','Aluguel recebido','Presente','Outros'],
  despesa: ['Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Vestuário','Contas','Outros']
};

let tipoAtual = 'receita';

function getData() {
  return JSON.parse(localStorage.getItem('financas_tx') || '[]');
}
function saveData(d) {
  localStorage.setItem('financas_tx', JSON.stringify(d));
}

function fmtMoney(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
}

function mesAtual() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id === 'dashboard') renderDashboard();
  if (id === 'extrato') renderExtrato();
}

function setTipo(t) {
  tipoAtual = t;
  document.getElementById('btnReceita').classList.toggle('active', t==='receita');
  document.getElementById('btnDespesa').classList.toggle('active', t==='despesa');
  preencheCategorias();
}

function preencheCategorias() {
  const sel = document.getElementById('fCategoria');
  sel.innerHTML = CATEGORIAS[tipoAtual].map(c => `<option>${c}</option>`).join('');
}

function salvar() {
  const desc = document.getElementById('fDesc').value.trim();
  const valor = parseFloat(document.getElementById('fValor').value);
  const categoria = document.getElementById('fCategoria').value;
  const data = document.getElementById('fData').value;

  if (!desc) return toast('⚠️ Informe uma descrição.');
  if (!valor || valor <= 0) return toast('⚠️ Informe um valor válido.');
  if (!data) return toast('⚠️ Informe a data.');

  const tx = getData();
  tx.push({ id: Date.now(), tipo: tipoAtual, desc, valor, categoria, data });
  saveData(tx);
  toast('✅ Lançamento salvo!');
  document.getElementById('fDesc').value = '';
  document.getElementById('fValor').value = '';
  document.getElementById('fData').value = '';
}

function deletar(id) {
  if (!confirm('Remover este lançamento?')) return;
  saveData(getData().filter(t => t.id !== id));
  renderDashboard();
  renderExtrato();
  toast('🗑️ Removido.');
}

function renderDashboard() {
  const mes = document.getElementById('mesFilter').value || mesAtual();
  const tx = getData().filter(t => t.data.startsWith(mes));

  const receitas = tx.filter(t=>t.tipo==='receita').reduce((a,t)=>a+t.valor,0);
  const despesas = tx.filter(t=>t.tipo==='despesa').reduce((a,t)=>a+t.valor,0);
  const saldo = receitas - despesas;

  document.getElementById('cardSaldo').textContent = fmtMoney(saldo);
  document.getElementById('cardReceita').textContent = fmtMoney(receitas);
  document.getElementById('cardDespesa').textContent = fmtMoney(despesas);

  // Gráfico de categorias
  const despTx = tx.filter(t=>t.tipo==='despesa');
  const cats = {};
  despTx.forEach(t => { cats[t.categoria] = (cats[t.categoria]||0) + t.valor; });
  const sorted = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxVal = sorted[0]?.[1] || 1;
  const barChart = document.getElementById('barChart');
  if (sorted.length === 0) {
    barChart.innerHTML = '<div class="empty-state">Nenhuma despesa neste mês.</div>';
  } else {
    barChart.innerHTML = sorted.map(([cat, val]) => `
      <div class="bar-row">
        <span class="bar-cat">${cat}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(val/maxVal*100).toFixed(1)}%"></div></div>
        <span class="bar-val">${fmtMoney(val)}</span>
      </div>`).join('');
  }

  // Últimas transações
  const recentes = [...tx].sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,5);
  const ult = document.getElementById('ultimas');
  if (recentes.length === 0) {
    ult.innerHTML = '<div class="empty-state">Nenhuma transação neste mês.</div>';
  } else {
    ult.innerHTML = recentes.map(t => itemHTML(t)).join('');
  }
}

function renderExtrato() {
  const mes = document.getElementById('extratoMes').value || mesAtual();
  const tipo = document.getElementById('extratoTipo').value;
  const cat = document.getElementById('extratoCategoria').value;

  let tx = getData().filter(t => t.data.startsWith(mes));
  if (tipo) tx = tx.filter(t=>t.tipo===tipo);
  if (cat) tx = tx.filter(t=>t.categoria===cat);
  tx.sort((a,b)=>new Date(b.data)-new Date(a.data));

  // preenche filtro categorias
  const allCats = [...new Set(getData().map(t=>t.categoria))].sort();
  const selCat = document.getElementById('extratoCategoria');
  const curCat = selCat.value;
  selCat.innerHTML = '<option value="">Todas as categorias</option>' +
    allCats.map(c=>`<option ${c===curCat?'selected':''}>${c}</option>`).join('');

  const lista = document.getElementById('listaExtrato');
  if (tx.length === 0) {
    lista.innerHTML = '<div class="empty-state">Nenhuma transação encontrada.</div>';
  } else {
    lista.innerHTML = tx.map(t => itemHTML(t)).join('');
  }
}

function itemHTML(t) {
  const d = new Date(t.data+'T12:00:00');
  const dataFmt = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  const sinal = t.tipo==='receita' ? '+' : '-';
  return `<div class="transacao-item">
    <span class="tipo-dot ${t.tipo}"></span>
    <div class="tx-info">
      <div class="tx-desc">${t.desc}</div>
      <div class="tx-meta">${t.categoria} · ${dataFmt}</div>
    </div>
    <span class="tx-valor ${t.tipo}">${sinal} ${fmtMoney(t.valor)}</span>
    <button class="tx-del" onclick="deletar(${t.id})">×</button>
  </div>`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

// INIT
document.getElementById('mesFilter').value = mesAtual();
document.getElementById('extratoMes').value = mesAtual();
document.getElementById('fData').value = new Date().toISOString().split('T')[0];
preencheCategorias();
renderDashboard();
</script>
</body>
</html>
