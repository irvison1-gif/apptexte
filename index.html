<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minhas Financas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--radius:14px;--t:.25s cubic-bezier(.4,0,.2,1);}
[data-theme="dark"]{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3348;--accent:#5b6af0;--al:#7c89f5;--green:#3ecf8e;--red:#f25c5c;--text:#e8eaf6;--muted:#7b82a3;--shadow:0 4px 24px rgba(0,0,0,.4);}
[data-theme="light"]{--bg:#f0f2fa;--surface:#fff;--surface2:#f5f6ff;--border:#dde1f5;--accent:#5b6af0;--al:#4a58e0;--green:#1faa6b;--red:#e03e3e;--text:#1a1d2e;--muted:#6b72a0;--shadow:0 4px 24px rgba(91,106,240,.1);}

#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,visibility .5s;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo{font-family:'Space Grotesk',sans-serif;font-size:2.8rem;font-weight:700;background:linear-gradient(135deg,#7c89f5,#3ecf8e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.2s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:.6;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.splash-track{width:200px;height:4px;background:#2e3348;border-radius:99px;overflow:hidden;}
.splash-fill{height:100%;background:linear-gradient(90deg,#5b6af0,#3ecf8e);border-radius:99px;width:0%;animation:loadbar 1.4s ease forwards;}
@keyframes loadbar{to{width:100%;}}
.splash-sub{font-size:13px;color:#7b82a3;}

body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;transition:background var(--t),color var(--t);}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.1);transition:background var(--t),border-color var(--t);}
header h1{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;}
header h1 span{color:var(--al);}
.header-right{display:flex;align-items:center;gap:10px;}
nav{display:flex;gap:4px;}
nav button{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;padding:7px 14px;border-radius:8px;transition:all var(--t);}
nav button.active,nav button:hover{background:var(--surface2);color:var(--text);}
nav button.active{color:var(--al);}
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:99px;cursor:pointer;padding:6px 12px;font-size:15px;line-height:1;transition:all var(--t);display:flex;align-items:center;gap:6px;}
.theme-btn:hover{border-color:var(--accent);}
.theme-label{font-size:11px;font-weight:600;color:var(--muted);font-family:'Inter',sans-serif;}

main{max-width:920px;margin:0 auto;padding:28px 20px;}
.page{display:none;}
.page.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
.card{border-radius:var(--radius);padding:22px 20px;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform var(--t),box-shadow var(--t);box-shadow:var(--shadow);}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(91,106,240,.2);}
.card.saldo{background:linear-gradient(135deg,#5b6af0,#3b4fd8);border-color:transparent;}
.card.receita{background:linear-gradient(135deg,rgba(62,207,142,.15),rgba(62,207,142,.03));}
.card.despesa{background:linear-gradient(135deg,rgba(242,92,92,.15),rgba(242,92,92,.03));}
.card::before{content:'';position:absolute;right:-18px;top:-18px;width:80px;height:80px;border-radius:50%;opacity:.12;}
.card.saldo::before{background:#fff;}
.card.receita::before{background:#3ecf8e;}
.card.despesa::before{background:#f25c5c;}
.card .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px;}
.card.saldo .lbl{color:rgba(255,255,255,.7);}
.card .val{font-family:'Space Grotesk',sans-serif;font-size:1.65rem;font-weight:700;}
.card.saldo .val{color:#fff;}
.card.receita .val{color:var(--green);}
.card.despesa .val{color:var(--red);}
.card .cicon{font-size:1.5rem;margin-bottom:10px;display:block;}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:background var(--t),border-color var(--t);}
.chart-wrap.full{grid-column:1/-1;}
.chart-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px;}

.pizza-container{display:flex;align-items:center;gap:20px;}
.pizza-legend{flex:1;display:flex;flex-direction:column;gap:8px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.legend-name{flex:1;color:var(--muted);}
.legend-val{font-weight:600;font-size:12px;}

.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-cat{width:100px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.bar-track{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.bar-val{width:80px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0;}

.transacao-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:all var(--t);margin-bottom:8px;animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.transacao-item:hover{border-color:var(--accent);transform:translateX(4px);}
.tx-icon{font-size:1.4rem;flex-shrink:0;}
.tx-info{flex:1;}
.tx-desc{font-weight:500;font-size:14px;}
.tx-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.tx-valor{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
.tx-valor.receita{color:var(--green);}
.tx-valor.despesa{color:var(--red);}
.tx-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px;transition:color var(--t);line-height:1;}
.tx-del:hover{color:var(--red);}

.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:540px;box-shadow:var(--shadow);}
.form-card h2{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:24px;}
.tipo-toggle{display:flex;gap:10px;margin-bottom:22px;}
.tipo-btn{flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:all var(--t);}
.tipo-btn.receita.active{border-color:var(--green);color:var(--green);background:rgba(62,207,142,.08);}
.tipo-btn.despesa.active{border-color:var(--red);color:var(--red);background:rgba(242,92,92,.08);}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px;}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color var(--t);}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field select option{background:var(--surface2);}
.btn-save{width:100%;padding:13px;background:linear-gradient(135deg,#5b6af0,#3b4fd8);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:all var(--t);margin-top:4px;}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(91,106,240,.4);}
.btn-save:active{transform:translateY(0);}

.filter-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.filter-row select,.filter-row input{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;}
.month-filter{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.month-filter label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.month-filter input{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;}

#toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 20px;font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:9998;}
#toast.show{transform:translateY(0);opacity:1;}
.empty-state{text-align:center;padding:36px;color:var(--muted);font-size:14px;}

@media(max-width:600px){
  .cards-row,.charts-row{grid-template-columns:1fr;}
  .chart-wrap.full{grid-column:auto;}
  header{padding:12px 14px;}
  nav button{font-size:11px;padding:6px 8px;}
  main{padding:16px 12px;}
}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">Financas</div>
  <div class="splash-track"><div class="splash-fill"></div></div>
  <div class="splash-sub">Carregando seus dados...</div>
</div>

<header>
  <h1>Minhas <span>Financas</span></h1>
  <div class="header-right">
    <nav>
      <button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
      <button onclick="showPage('novo',this)">+ Lancar</button>
      <button onclick="showPage('extrato',this)">Extrato</button>
    </nav>
    <button class="theme-btn" onclick="toggleTheme()">
      <span id="themeIcon">&#9728;</span>
      <span class="theme-label" id="themeLabel">Claro</span>
    </button>
  </div>
</header>

<main>
  <div id="dashboard" class="page active">
    <div class="month-filter">
      <label>Mes:</label>
      <input type="month" id="mesFilter" onchange="renderDashboard()"/>
    </div>
    <div class="cards-row">
      <div class="card saldo"><span class="cicon">&#128179;</span><div class="lbl">Saldo do mes</div><div class="val" id="cardSaldo">R$ 0,00</div></div>
      <div class="card receita"><span class="cicon">&#128200;</span><div class="lbl">Receitas</div><div class="val" id="cardReceita">R$ 0,00</div></div>
      <div class="card despesa"><span class="cicon">&#128201;</span><div class="lbl">Despesas</div><div class="val" id="cardDespesa">R$ 0,00</div></div>
    </div>
    <div class="charts-row">
      <div class="chart-wrap"><div class="chart-title">Despesas por categoria</div><div id="pizzaWrap"><div class="empty-state">Nenhuma despesa.</div></div></div>
      <div class="chart-wrap"><div class="chart-title">Ranking de gastos</div><div class="bar-chart" id="barChart"><div class="empty-state">Nenhuma despesa.</div></div></div>
      <div class="chart-wrap full"><div class="chart-title">Ultimas transacoes</div><div id="ultimas"><div class="empty-state">Nenhuma transacao neste mes.</div></div></div>
    </div>
  </div>

  <div id="novo" class="page">
    <div class="form-card">
      <h2>Novo Lancamento</h2>
      <div class="tipo-toggle">
        <button class="tipo-btn receita active" id="btnReceita" onclick="setTipo('receita')">Receita</button>
        <button class="tipo-btn despesa" id="btnDespesa" onclick="setTipo('despesa')">Despesa</button>
      </div>
      <div class="field"><label>Descricao</label><input type="text" id="fDesc" placeholder="Ex: Salario, Supermercado..."/></div>
      <div class="field"><label>Valor (R$)</label><input type="number" id="fValor" placeholder="0,00" min="0" step="0.01"/></div>
      <div class="field"><label>Categoria</label><select id="fCategoria"></select></div>
      <div class="field"><label>Data</label><input type="date" id="fData"/></div>
      <button class="btn-save" onclick="salvar()">Salvar lancamento</button>
    </div>
  </div>

  <div id="extrato" class="page">
    <div class="filter-row">
      <input type="month" id="extratoMes" onchange="renderExtrato()"/>
      <select id="extratoTipo" onchange="renderExtrato()">
        <option value="">Todos</option>
        <option value="receita">Receitas</option>
        <option value="despesa">Despesas</option>
      </select>
      <select id="extratoCategoria" onchange="renderExtrato()"><option value="">Todas as categorias</option></select>
    </div>
    <div id="listaExtrato"><div class="empty-state">Nenhuma transacao encontrada.</div></div>
  </div>
</main>

<div id="toast"></div>

<script>
var CATS={
  receita:[
    {n:'Salario',i:'&#128188;',c:'#5b6af0'},{n:'Freelance',i:'&#128187;',c:'#7c89f5'},
    {n:'Investimentos',i:'&#128202;',c:'#3ecf8e'},{n:'Aluguel recebido',i:'&#127968;',c:'#f5a623'},
    {n:'Presente',i:'&#127873;',c:'#f25c5c'},{n:'Outros',i:'&#10133;',c:'#7b82a3'}
  ],
  despesa:[
    {n:'Alimentacao',i:'&#127828;',c:'#f25c5c'},{n:'Moradia',i:'&#127968;',c:'#f5a623'},
    {n:'Transporte',i:'&#128663;',c:'#5b6af0'},{n:'Saude',i:'&#10084;',c:'#e055a3'},
    {n:'Lazer',i:'&#127918;',c:'#3ecf8e'},{n:'Educacao',i:'&#128218;',c:'#7c89f5'},
    {n:'Vestuario',i:'&#128083;',c:'#f5a623'},{n:'Contas',i:'&#128161;',c:'#ffcc00'},
    {n:'Outros',i:'&#128230;',c:'#7b82a3'}
  ]
};

function getCat(nome,tipo){
  var list=CATS[tipo]||CATS.despesa;
  for(var i=0;i<list.length;i++){if(list[i].n===nome)return list[i];}
  return{i:'&#128176;',c:'#7b82a3'};
}
function getData(){return JSON.parse(localStorage.getItem('financas_tx')||'[]');}
function saveData(d){localStorage.setItem('financas_tx',JSON.stringify(d));}
function fmt(v){return'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function mesAtual(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function toggleTheme(){
  var html=document.documentElement;
  var dark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeIcon').innerHTML=dark?'&#9790;':'&#9728;';
  document.getElementById('themeLabel').textContent=dark?'Escuro':'Claro';
  localStorage.setItem('financas_theme',dark?'light':'dark');
}
function initTheme(){
  var s=localStorage.getItem('financas_theme')||'dark';
  document.documentElement.setAttribute('data-theme',s);
  document.getElementById('themeIcon').innerHTML=s==='dark'?'&#9728;':'&#9790;';
  document.getElementById('themeLabel').textContent=s==='dark'?'Claro':'Escuro';
}

function showPage(id,btn){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if(id==='dashboard')renderDashboard();
  if(id==='extrato')renderExtrato();
}

var tipoAtual='receita';
function setTipo(t){
  tipoAtual=t;
  document.getElementById('btnReceita').classList.toggle('active',t==='receita');
  document.getElementById('btnDespesa').classList.toggle('active',t==='despesa');
  preencheCats();
}
function preencheCats(){
  document.getElementById('fCategoria').innerHTML=CATS[tipoAtual].map(function(c){
    return'<option value="'+c.n+'">'+c.i+' '+c.n+'</option>';
  }).join('');
}

function salvar(){
  var desc=document.getElementById('fDesc').value.trim();
  var valor=parseFloat(document.getElementById('fValor').value);
  var categoria=document.getElementById('fCategoria').value;
  var data=document.getElementById('fData').value;
  if(!desc)return toast('Informe uma descricao.');
  if(!valor||valor<=0)return toast('Informe um valor valido.');
  if(!data)return toast('Informe a data.');
  var tx=getData();
  tx.push({id:Date.now(),tipo:tipoAtual,desc:desc,valor:valor,categoria:categoria,data:data});
  saveData(tx);
  toast('Lancamento salvo!');
  document.getElementById('fDesc').value='';
  document.getElementById('fValor').value='';
}

function deletar(id){
  if(!confirm('Remover este lancamento?'))return;
  saveData(getData().filter(function(t){return t.id!==id;}));
  renderDashboard();renderExtrato();
  toast('Removido.');
}

function renderPizza(cats){
  var wrap=document.getElementById('pizzaWrap');
  if(!cats.length){wrap.innerHTML='<div class="empty-state">Nenhuma despesa neste mes.</div>';return;}
  var total=cats.reduce(function(a,c){return a+c.val;},0);
  var size=130,cx=65,cy=65,r=50,ri=26;
  var startAngle=-Math.PI/2,slices='',legend='';
  cats.slice(0,6).forEach(function(c){
    var angle=(c.val/total)*Math.PI*2;
    var end=startAngle+angle;
    var x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
    var x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    var xi1=cx+ri*Math.cos(startAngle),yi1=cy+ri*Math.sin(startAngle);
    var xi2=cx+ri*Math.cos(end),yi2=cy+ri*Math.sin(end);
    var lg=angle>Math.PI?1:0;
    slices+='<path d="M'+xi1+','+yi1+' L'+x1+','+y1+' A'+r+','+r+',0,'+lg+',1,'+x2+','+y2+' L'+xi2+','+yi2+' A'+ri+','+ri+',0,'+lg+',0,'+xi1+','+yi1+'Z" fill="'+c.color+'" opacity=".9"/>';
    legend+='<div class="legend-item"><span class="legend-dot" style="background:'+c.color+'"></span><span class="legend-name">'+c.icon+' '+c.nome+'</span><span class="legend-val" style="color:'+c.color+'">'+((c.val/total)*100).toFixed(0)+'%</span></div>';
    startAngle=end;
  });
  wrap.innerHTML='<div class="pizza-container"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+slices+'</svg><div class="pizza-legend">'+legend+'</div></div>';
}

function renderDashboard(){
  var mes=document.getElementById('mesFilter').value||mesAtual();
  var tx=getData().filter(function(t){return t.data.indexOf(mes)===0;});
  var receitas=tx.filter(function(t){return t.tipo==='receita';}).reduce(function(a,t){return a+t.valor;},0);
  var despesas=tx.filter(function(t){return t.tipo==='despesa';}).reduce(function(a,t){return a+t.valor;},0);
  document.getElementById('cardSaldo').textContent=fmt(receitas-despesas);
  document.getElementById('cardReceita').textContent=fmt(receitas);
  document.getElementById('cardDespesa').textContent=fmt(despesas);

  var catsMap={};
  tx.filter(function(t){return t.tipo==='despesa';}).forEach(function(t){
    catsMap[t.categoria]=(catsMap[t.categoria]||0)+t.valor;
  });
  var sorted=Object.entries(catsMap).sort(function(a,b){return b[1]-a[1];});
  var catsArr=sorted.map(function(e){
    var info=getCat(e[0],'despesa');
    return{nome:e[0],val:e[1],color:info.c,icon:info.i};
  });

  renderPizza(catsArr);

  var maxV=catsArr.length?catsArr[0].val:1;
  var barChart=document.getElementById('barChart');
  if(!catsArr.length){barChart.innerHTML='<div class="empty-state">Nenhuma despesa.</div>';}
  else{
    barChart.innerHTML=catsArr.map(function(c){
      return'<div class="bar-row"><span class="bar-cat">'+c.icon+' '+c.nome+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(c.val/maxV*100).toFixed(1)+'%;background:'+c.color+'"></div></div><span class="bar-val" style="color:'+c.color+'">'+fmt(c.val)+'</span></div>';
    }).join('');
  }

  var recentes=tx.slice().sort(function(a,b){return new Date(b.data)-new Date(a.data);}).slice(0,5);
  document.getElementById('ultimas').innerHTML=recentes.length?recentes.map(function(t){return itemHTML(t);}).join(''):'<div class="empty-state">Nenhuma transacao neste mes.</div>';
}

function renderExtrato(){
  var mes=document.getElementById('extratoMes').value||mesAtual();
  var tipo=document.getElementById('extratoTipo').value;
  var cat=document.getElementById('extratoCategoria').value;
  var tx=getData().filter(function(t){return t.data.indexOf(mes)===0;});
  if(tipo)tx=tx.filter(function(t){return t.tipo===tipo;});
  if(cat)tx=tx.filter(function(t){return t.categoria===cat;});
  tx.sort(function(a,b){return new Date(b.data)-new Date(a.data);});
  var allCats=[...new Set(getData().map(function(t){return t.categoria;}))].sort();
  var selCat=document.getElementById('extratoCategoria');
  var cur=selCat.value;
  selCat.innerHTML='<option value="">Todas as categorias</option>'+allCats.map(function(c){return'<option'+(c===cur?' selected':'')+'>'+c+'</option>';}).join('');
  document.getElementById('listaExtrato').innerHTML=tx.length?tx.map(function(t){return itemHTML(t);}).join(''):'<div class="empty-state">Nenhuma transacao encontrada.</div>';
}

function itemHTML(t){
  var d=new Date(t.data+'T12:00:00');
  var df=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  var info=getCat(t.categoria,t.tipo);
  var s=t.tipo==='receita'?'+':'-';
  return'<div class="transacao-item"><span class="tx-icon">'+info.i+'</span><div class="tx-info"><div class="tx-desc">'+t.desc+'</div><div class="tx-meta">'+t.categoria+' - '+df+'</div></div><span class="tx-valor '+t.tipo+'">'+s+' '+fmt(t.valor)+'</span><button class="tx-del" onclick="deletar('+t.id+')">x</button></div>';
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2800);
}

initTheme();
document.getElementById('mesFilter').value=mesAtual();
document.getElementById('extratoMes').value=mesAtual();
document.getElementById('fData').value=new Date().toISOString().split('T')[0];
preencheCats();
renderDashboard();
setTimeout(function(){document.getElementById('splash').classList.add('hide');},1600);
</script>
</body>
</html>
